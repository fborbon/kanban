name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_URL: /
        run: npm run build

      # The app is served from the EC2 host at kanban.forwardforecasting.eu, behind the central login
      # (Authelia). The old S3 + CloudFront hosting was retired 2026-10-15 (attachments were public).
      - name: Deploy frontend to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ ubuntu@${{ secrets.EC2_HOST }}:/var/www/kanban/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # Lambda env (ORIGIN_SECRET, SCRUM_USER) is managed outside the repo; only the code is deployed.
      - name: Deploy API (Lambda kanban-api)
        run: |
          cd server && npm ci --omit=dev && zip -qr ../lambda.zip . && cd ..
          aws lambda update-function-code --function-name kanban-api --zip-file fileb://lambda.zip >/dev/null
          aws lambda wait function-updated-v2 --function-name kanban-api

      - name: Verify live site
        run: |
          sleep 5
          # Logged out, every path must redirect to the central login portal
          STATUS=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" https://kanban.forwardforecasting.eu/)
          echo "$STATUS"
          echo "$STATUS" | grep -q "^302 https://forwardforecasting.eu/auth/" || exit 1
          # The API must refuse anything that does not come through nginx
          API=$(curl -s -o /dev/null -w "%{http_code}" https://jz9kfi5pui.execute-api.eu-west-1.amazonaws.com/state)
          echo "direct API: $API"; [ "$API" = "401" ] || exit 1

      - name: Sync demo to Landing repo
        env:
          LANDING_TOKEN: ${{ secrets.LANDING_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 \
            "https://x-access-token:${LANDING_TOKEN}@github.com/fborbon/forwardforecasting-landing.git" \
            /tmp/landing

          # Copy the static demo page
          cp Landing/kanban/index.html /tmp/landing/kanban/index.html

          cd /tmp/landing
          git add kanban/index.html
          if git diff --cached --quiet; then
            echo "Demo unchanged — skipping commit"
          else
            git commit -m "kanban: sync demo from kanban@${{ github.sha }}"
            git push
          fi
